<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Discord Hack Cleaner</title>
    <link rel="icon" href="../assets/icon-32.png" />
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="app-page popup-page">
    <main class="stack">
      <div class="popup-brand">
        <img src="../assets/icon-32.png" alt="" width="32" height="32" />
        <h1>Discord Hack Cleaner</h1>
      </div>
      <p class="muted">Find and review scam messages sent from your account after a Discord hack or token theft.</p>
      <section id="first-run" class="first-run stack" hidden>
        <h2>Secure your account first</h2>
        <p>
          Change your password from a trusted device, enable MFA, and review active sessions and authorized
          apps.
        </p>
        <a href="guide.html#account-recovery" target="_blank" rel="noopener">Open the recovery checklist</a>
        <button id="dismiss-first-run" class="subtle">Dismiss</button>
      </section>
      <button data-mode="user" class="primary">Scan my messages</button>
      <button data-mode="owner">Scan as server owner</button>
      <a class="button" href="report.html" target="_blank" rel="noopener">Review a saved report</a>
      <a href="guide.html" target="_blank" rel="noopener">FAQ</a>
      <p id="status" class="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
